name: plp

# Ports are published on 127.0.0.1 only: this file is for development, not the pilot.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: plp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plp_dev_password}
      POSTGRES_DB: plp
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h forces TCP, so the temporary socket-only init server doesn't count as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "plp", "-d", "plp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  model:
    build: ../services/model
    environment:
      BKT_PARAMS_PATH: /ml/artifacts/bkt_params.json
      TOPIC_SKILL_MAP_PATH: /ml/topic_skill_map.csv
      DKT_DIR: /ml/artifacts/dkt
    # Trained models and the topic map are read from ml/ at start-up. Until
    # ml/artifacts/bkt_params.json exists, every topic uses placeholder BKT parameters;
    # until ml/artifacts/dkt/ exists (notebook 03), DKT is off and p_dkt is stored as null.
    # After replacing either file: docker compose restart model
    volumes:
      - ../ml:/ml:ro
    ports:
      - "127.0.0.1:${MODEL_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://plp:${POSTGRES_PASSWORD:-plp_dev_password}@postgres:5432/plp
      MODEL_URL: http://model:8000
      # Condition for new participants: random (balanced blocks of 4, for the pilot), or
      # fixed / personalised to force one while developing.
      NEW_USER_CONDITION: ${NEW_USER_CONDITION:-random}
      # Practice questions per participant, the same in both conditions (a multiple of 10 topics).
      PRACTICE_LENGTH: ${PRACTICE_LENGTH:-30}
      # Answers needed on a topic before the personalised path may skip it as mastered.
      PERSONALISED_MIN_ANSWERS: ${PERSONALISED_MIN_ANSWERS:-2}
      # Most questions on a topic before the personalised path moves on, mastered or not.
      PERSONALISED_MAX_PER_TOPIC: ${PERSONALISED_MAX_PER_TOPIC:-5}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Migrations and the seed run before the server starts.
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
